<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title description">
  <title id="title">GETDDO 사용자 이용 흐름 시퀀스</title>
  <desc id="description">사용자가 홈에서 이벤트와 응모 조건을 확인하고, 필요한 경우 출석·일회성 미션·게임으로 응모권을 모은 뒤 이벤트에 응모한다. 마감 후 검토·추첨을 거쳐 관리자가 발표를 승인하면 결과가 공개된다. 사용자는 알림함 또는 이벤트 화면에서 본인의 당첨 여부와 경품을 확인한다. 응모권 미사용 이벤트는 차감 없이 참여하며, 응모권이 충분하면 획득 단계를 건너뛸 수 있다.</desc>
  <defs>
    <marker id="request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#00805d"/></marker>
    <marker id="response" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#596778" stroke-width="1.6"/></marker>
  </defs>
  <style>
    text { font-family:Pretendard, 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif; fill:#20262e; }
    .actor { font-size:26px; font-weight:700; text-anchor:middle; }
    .message { font-size:24px; text-anchor:middle; }
    .action { font-weight:650; }
    .detail { font-size:21px; fill:#596778; }
    .small { font-size:19px; fill:#596778; }
    .phase { font-size:24px; font-weight:700; fill:#00684b; }
    .number { font-size:18px; font-weight:700; fill:#00805d; letter-spacing:2px; }
    .lifeline { stroke:#b3c3bd; stroke-width:2; stroke-dasharray:6 7; }
    .request { fill:none; stroke:#00805d; stroke-width:2.5; marker-end:url(#request); }
    .response { fill:none; stroke:#596778; stroke-width:2; stroke-dasharray:8 5; marker-end:url(#response); }
  </style>
  <rect width="1600" height="680" fill="#fff"/>

  <!-- Participants stay fixed; time runs downward through the full user journey. -->
  <rect x="197" y="6" width="176" height="52" rx="12" fill="#e8faf3" stroke="#1fbe8e"/>
  <text class="actor" x="285" y="41">사용자</text>
  <rect x="779" y="6" width="242" height="52" rx="12" fill="#e8faf3" stroke="#1fbe8e"/>
  <text class="actor" x="900" y="41">GETDDO 서비스</text>
  <rect x="1302" y="6" width="196" height="52" rx="12" fill="#fff4d2" stroke="#d9b855"/>
  <text class="actor" x="1400" y="41">관리자</text>
  <path class="lifeline" d="M285 58V650M900 58V650M1400 58V650"/>

  <rect x="8" y="77" width="155" height="89" rx="12" fill="#e8faf3"/>
  <text class="number" x="26" y="105">01</text><text class="phase" x="26" y="140">둘러보기</text>
  <text class="message action" x="592" y="93">홈 접속 · 이벤트 둘러보기</text>
  <path class="request" d="M285 108H900"/>
  <text class="message" x="592" y="137">경품·응모 조건 · 보유 응모권 확인</text>
  <path class="response" d="M900 152H285"/>

  <!-- opt: reward activities are optional, not a prerequisite for every event. -->
  <rect x="8" y="178" width="155" height="116" rx="12" fill="#e8faf3"/>
  <text class="number" x="26" y="207">02</text><text class="phase" x="26" y="242">응모권 획득</text>
  <text class="small" x="26" y="272">선택 단계</text>
  <rect x="197" y="177" width="804" height="118" rx="8" fill="#e8faf3" fill-opacity="0.5" stroke="#8fc9b7" stroke-dasharray="5 4"/>
  <rect x="212" y="166" width="318" height="25" fill="#fff"/>
  <text class="small" x="223" y="185">opt · 응모권을 더 모으려는 경우</text>
  <text class="message action" x="592" y="209">출석·일회성 미션·게임 참여</text>
  <path class="request" d="M285 224H900"/>
  <text class="message" x="592" y="257">보상 지급 · 보유 응모권 확인</text>
  <path class="response" d="M900 272H285"/>
  <rect x="1055" y="199" width="512" height="75" rx="10" fill="#f5f7f8"/>
  <text class="detail" x="1075" y="228">응모권 미사용 이벤트·보유량 충분 시</text>
  <text class="detail" x="1075" y="257">획득 단계를 건너뛰고 응모 가능</text>

  <rect x="8" y="307" width="155" height="119" rx="12" fill="#e8faf3"/>
  <text class="number" x="26" y="336">03</text><text class="phase" x="26" y="372">이벤트 응모</text>
  <text class="message action" x="592" y="323">이벤트 선택 · 응모하기</text>
  <path class="request" d="M285 338H900"/>
  <text class="message" x="592" y="377">응모 내역 · 차감 후 잔액 확인</text>
  <path class="response" d="M900 392H285"/>
  <text class="small" x="309" y="419">응모 불가 시 사유 안내 · 잔액 부족 시 응모권 획득으로</text>
  <rect x="1055" y="305" width="512" height="111" rx="10" fill="#f5f7f8"/>
  <text class="detail" x="1075" y="335">응모 자격·기간·응모권 확인</text>
  <text class="detail" x="1075" y="368">미사용형: 차감 없음 · 사용자당 1회</text>
  <text class="detail" x="1075" y="400">사용형: 이벤트 규칙에 따라 응모권 차감</text>

  <rect x="8" y="441" width="155" height="209" rx="12" fill="#e8faf3"/>
  <text class="number" x="26" y="474">04</text><text class="phase" x="26" y="510">결과 확인</text>
  <text class="small" x="26" y="544">발표 대기</text><text class="small" x="26" y="573">↓</text><text class="small" x="26" y="603">결과 조회</text>
  <text class="message" x="592" y="459">응모 마감 · 결과 발표 대기</text>
  <path class="response" d="M900 474H285"/>
  <rect x="1015" y="437" width="552" height="53" rx="8" fill="#fff4d2"/>
  <text class="small" x="1035" y="458">마감 후 검토·추첨</text>
  <text class="small" x="1035" y="481">사용형: 자동 · 미사용형: 관리자 실행</text>
  <text class="message action" x="1150" y="507">결과 확인 · 발표 승인</text>
  <path class="request" d="M1400 522H900"/>
  <text class="message" x="592" y="545">결과 공개 · 알림함 안내</text>
  <path class="response" d="M900 560H285"/>
  <text class="message action" x="592" y="585">알림 또는 이벤트에서 결과 확인</text>
  <path class="request" d="M285 600H900"/>
  <text class="message" x="592" y="625">본인 당첨 여부 · 경품 확인</text>
  <path class="response" d="M900 640H285"/>
  <text class="small" x="1015" y="584">발표 승인 전 당첨 결과 비공개</text>
  <text class="small" x="1015" y="617">추첨 시 접속 유지 불필요</text>
</svg>
